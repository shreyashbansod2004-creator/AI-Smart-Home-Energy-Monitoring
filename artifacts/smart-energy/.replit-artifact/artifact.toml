kind = "web"
previewPath = "/"
title = "AI Smart Home Energy Monitor"
version = "1.0.0"
id = "artifacts/smart-energy"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/smart-energy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-energy", "run", "build" ]
serve = "static"
publicDir = "artifacts/smart-energy/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
