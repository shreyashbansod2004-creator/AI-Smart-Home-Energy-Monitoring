; PlatformIO project configuration for Smart Energy ESP32 Monitor
; Flash with: pio run --target upload

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor speed
monitor_speed = 115200

; Build flags
build_flags =
    -D CORE_DEBUG_LEVEL=1

; Libraries required
; DNSServer and WebServer are part of the ESP32 Arduino core — no extra entry needed.
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    bblanchon/ArduinoJson @ ^7.0.0

; Source directory
src_dir = src
