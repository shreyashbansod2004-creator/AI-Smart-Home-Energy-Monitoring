name: CI

on:
  push:
    branches:
      - fix/demo-mode-dashboard-hardening
      - fix/render-pnpm-build-approval
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh lockfile metadata for the pinned pnpm version
        run: pnpm install --lockfile-only --no-frozen-lockfile --network-concurrency=1 --child-concurrency=1 --reporter=append-only

      - name: Commit pnpm 12 lockfile metadata when it changes
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already matches pnpm 12.16.1"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh pnpm 12 lockfile metadata"
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile --network-concurrency=1 --child-concurrency=1 --reporter=append-only

      - name: Run backend and frontend tests
        run: pnpm run test

      - name: Typecheck workspace libraries, backend and frontend
        run: pnpm run typecheck

      - name: Build all workspace applications
        run: PORT=5173 BASE_PATH=/ pnpm -r --workspace-concurrency=1 --if-present run build
