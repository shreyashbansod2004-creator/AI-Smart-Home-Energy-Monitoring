name: CI

on:
  push:
    branches:
      - fix/demo-mode-dashboard-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile --network-concurrency=1 --child-concurrency=1 --reporter=append-only

      - name: Run backend and frontend tests
        run: pnpm run test

      - name: Typecheck workspace libraries, backend and frontend
        run: pnpm run typecheck

      - name: Build all workspace applications
        run: pnpm -r --workspace-concurrency=1 --if-present run build
